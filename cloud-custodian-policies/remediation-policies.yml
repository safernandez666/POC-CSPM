# NOTA sobre notificaciones a Slack:
# El campo `url` de cada acción `webhook` usa el placeholder ${SLACK_WEBHOOK_URL}.
# Cloud Custodian NO soporta interpolar variables de entorno en las policies,
# así que este archivo se corre a través de ./render-policies.sh, que lee
# SLACK_WEBHOOK_URL desde .env y genera remediation-policies.rendered.yml
# (gitignored, con la URL real) — ese es el archivo que se le pasa a `custodian run`.
policies:
  # ============================================
  # Política 1: Cerrar Security Groups con SSH abierto a 0.0.0.0/0
  # ============================================
  - name: close-ssh-security-groups
    description: |
      Remedia Security Groups que tienen SSH (puerto 22) abierto a todo internet (0.0.0.0/0).
      Riesgo: CIS 5.2 - Permite ataques de fuerza bruta desde cualquier IP.
    resource: aws.security-group
    filters:
      # Solo recursos con nuestro tag de demo
      - tag:Project: cspm-demo
      # Que tengan SSH abierto a 0.0.0.0/0
      - type: ingress
        Cidr:
          value: "0.0.0.0/0"
        Ports: [22]
    actions:
      # Remover la regla peligrosa
      - type: remove-permissions
        ingress: matched
      - type: webhook
        url: "${SLACK_WEBHOOK_URL}"
        batch: true
        body: "{text: join('', ['🔧 *Cloud Custodian* cerró SSH (22) abierto a `0.0.0.0/0` en *', to_string(length(resources)), '* security group(s): `', join('`, `', resources[].GroupId), '` — cuenta ', account_id, ', región ', region])}"

  # ============================================
  # Política 2: Cerrar Security Groups con RDP abierto a 0.0.0.0/0
  # ============================================
  - name: close-rdp-security-groups
    description: |
      Remedia Security Groups que tienen RDP (puerto 3389) abierto a todo internet.
      Riesgo: Vector principal de ransomware.
    resource: aws.security-group
    filters:
      - tag:Project: cspm-demo
      - type: ingress
        Cidr:
          value: "0.0.0.0/0"
        Ports: [3389]
    actions:
      - type: remove-permissions
        ingress: matched
      - type: webhook
        url: "${SLACK_WEBHOOK_URL}"
        batch: true
        body: "{text: join('', ['🔧 *Cloud Custodian* cerró RDP (3389) abierto a `0.0.0.0/0` en *', to_string(length(resources)), '* security group(s): `', join('`, `', resources[].GroupId), '` — cuenta ', account_id, ', región ', region])}"

  # ============================================
  # Política 3: Bloquear acceso público en S3 buckets
  # ============================================
  - name: block-public-s3-buckets
    description: |
      Habilita Block Public Access en buckets S3 públicos.
      Riesgo: CIS 2.1.5 - Exposición de datos sensibles.
    resource: aws.s3
    filters:
      - tag:Project: cspm-demo
      # Buckets que NO tienen public access block habilitado.
      # NOTA: antes esto usaba `type: value, key: PublicAccessBlockConfiguration.*`,
      # pero ese campo no viene poblado en el recurso base de c7n — la policy
      # nunca matcheaba aunque el bucket estuviera realmente expuesto.
      # `check-public-block` sí hace la llamada real a la API y, sin parámetros,
      # matchea si CUALQUIERA de los 4 settings está en false/unset.
      - type: check-public-block
    actions:
      # Habilitar Block Public Access
      - type: set-public-block
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      - type: webhook
        url: "${SLACK_WEBHOOK_URL}"
        batch: true
        body: "{text: join('', ['🔧 *Cloud Custodian* bloqueó acceso público en *', to_string(length(resources)), '* bucket(s) S3: `', join('`, `', resources[].Name), '` — cuenta ', account_id, ', región ', region])}"

  # ============================================
  # Política 4: Habilitar encriptación en S3 buckets
  # ============================================
  - name: enable-s3-encryption
    description: |
      Habilita encriptación server-side (AES256) en buckets S3.
      Riesgo: CIS 2.1.1 - Datos en reposo sin protección.
    resource: aws.s3
    filters:
      - tag:Project: cspm-demo
      # Buckets sin encriptación configurada
      - type: bucket-encryption
        state: false
    actions:
      # Habilitar encriptación AES256
      - type: set-bucket-encryption
        enabled: true
        crypto: AES256
      - type: webhook
        url: "${SLACK_WEBHOOK_URL}"
        batch: true
        body: "{text: join('', ['🔧 *Cloud Custodian* habilitó encriptación AES256 en *', to_string(length(resources)), '* bucket(s) S3: `', join('`, `', resources[].Name), '` — cuenta ', account_id, ', región ', region])}"

  # ============================================
  # Política 5: Forzar IMDSv2 en instancias EC2
  # ============================================
  - name: enforce-imdsv2
    description: |
      Fuerza IMDSv2 (HttpTokens=required) en instancias EC2 que todavía
      tienen IMDSv1 habilitado. Riesgo: IMDSv1 es vulnerable a SSRF.
      Esto NO requiere detener la instancia — ModifyInstanceMetadataOptions
      es una llamada en caliente sobre la instancia corriendo.
      Ref: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-metadata-transition-to-version-2.html
    resource: aws.ec2
    filters:
      - tag:Project: cspm-demo
      - type: value
        key: MetadataOptions.HttpTokens
        value: optional
    actions:
      - type: set-metadata-access
        tokens: required
      - type: webhook
        url: "${SLACK_WEBHOOK_URL}"
        batch: true
        body: "{text: join('', ['🔧 *Cloud Custodian* forzó IMDSv2 (sin downtime) en *', to_string(length(resources)), '* instancia(s) EC2: `', join('`, `', resources[].InstanceId), '` — cuenta ', account_id, ', región ', region])}"

policies:
  # ============================================
  # Política 1: Bloquear acceso público en S3
  # ============================================
  - name: block-public-s3
    description: Habilita Block Public Access en buckets con tag Project=cspm-demo
    resource: aws.s3
    filters:
      - type: value
        key: "Tags[?Key=='Project'].Value | [0]"
        value: cspm-demo
    actions:
      - type: set-public-block
        BlockPublicAcls: true
        BlockPublicPolicy: true  
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ============================================
  # Política 2: Habilitar encriptación en S3
  # ============================================
  - name: enable-s3-encryption
    description: Habilita encriptación AES256 en buckets
    resource: aws.s3
    filters:
      - type: value
        key: "Tags[?Key=='Project'].Value | [0]"
        value: cspm-demo
    actions:
      - type: set-bucket-encryption
        enabled: true
        crypto: AES256

  # ============================================
  # Política 3: Remover ACL público
  # ============================================
  - name: remove-public-acl
    description: Remueve ACL de lectura pública de buckets
    resource: aws.s3
    filters:
      - type: value
        key: "Tags[?Key=='Project'].Value | [0]"
        value: cspm-demo
      - type: global-grants
        permissions:
          - READ
    actions:
      - type: delete-global-grants
        grantees:
          - "http://acs.amazonaws.com/groups/global/AllUsers"
